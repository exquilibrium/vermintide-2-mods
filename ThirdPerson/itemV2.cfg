title = "Third Person";
description = "
Play the game from third person perspective.

[b]Features:[/b]
[list]
[*] Toggable 3rd person mode.
[*] Adjustable camera and weapon zoom.
[*] Improved combat and ingame interaction for 3rd person.
[/list]

[b]Setup: Crosshair Placement for Melee: (RECOMMENDED)[/b]
The default values for the camera are very general and can feel off with certain weapons. For the best melee experience it is recommended to do a basic setup for your weapon of choice. Follow these steps inside your keep:
[list]
[*] In 1st person aim your crosshair at the dummy head
[*] Position yourself so that all melee attacks can headshot.
[*] Toggle third person.
[*] Adjust camera position (X/Y Offset), angle (Yaw/Pitch Offset), distance.
[/list]

[h1]Credits[/h1]
This mod is inspired from [url=https://steamcommunity.com/sharedfiles/filedetails/?id=1381145345]ThirdPerson2[/url] mod by grasmann.
";
