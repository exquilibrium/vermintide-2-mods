title = "ThirdPerson";
description = "
[h1]Third Person[/h1]
Play the game in Third Person. Based on the original [url=https://steamcommunity.com/sharedfiles/filedetails/?id=1381145345]ThirdPerson2[/url] mod by grasmann.

[b]Features:[/b]
[list]
[*] Client-side mod
[*] Toggable 3rd person mode
[*] Adjustable 3rd person camera and zoom
[*] Ranged weapon attacks are projected from the 3rd person camera.
[*] Improved melee and ranged combat for 3rd person
[/list]

[b]Setup for Crosshair Placement for Melee: (RECOMMENDED)[/b]
The default values for the camera are very general and can feel off with certain weapons. For the best melee experience it is recommended to do a basic setup for your weapon of choice. Follow these steps inside your keep:
[list]
[*] In 1st person aim your melee weapon at the dummy's head
[*] Get close enough so that all attacks can headshot the dummy.
[*] Toggle third person.
[*] Adjust camera position, angle, distance.
[/list]
";
