title = "ThirdPerson";
description = "
[h1]Third Person[/h1]
Play the game in Third Person. Based on the original ThirdPerson2 mod by grasmann.

[b]Features:[/b]
[list]
[*] Toggable 3rd person mode
[*] Adjustable camera position
[*] Improved melee and ranged combat for 3rd person
[/list]

[b]Setup for Melee Weapons (RECOMMENDED):[/b]
The default values for the camera are very general and can feel off with certain weapons. For the best melee experience it is recommended to do a basic setup for your weapon of choice. Follow these steps inside your keep:
[list]
[*] In 1st person aim your melee weapon at the dummy's head
[*] Get close enough so that all attacks can headshot the dummy.
[*] Toggle third person.
[*] Adjust camera position, angle, distance so that the crosshairs overlaps with the dummy's head in 3rd person.
[/list]

[b]Details:[/b]
[list]
[*] Ranged weapon attacks are projected from the third person camera.
[*] Adjustable yaw and pitch (needed for better melee combat feel) might get removed at some point. This part complicates player movement, camera/mouse movement and aiming as these need to subtract the yaw/pitch changes.
[/list]

[b]TODO:[/b]
[list]
[*] Opacity for player model
[*] Opacity for ADS
[*] ADS in 1st person mode
[/list]
";
