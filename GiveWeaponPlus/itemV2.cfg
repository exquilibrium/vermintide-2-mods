title = "GiveWeaponPlus";
description = "
[b]Give Weapon Plus combines the classic GiveWeapon, SaveWeapon and its qol/fixes mods into one singular mod.[/b]

This mod will automatically import your existing settings and weapons from SaveWeapon. For mod usage consult the orginal mod pages linked under [b]Disclaimer[/b]. Mods listed under disclaimer can be disabled, since this mod replaces their functionality.

[h1]New Features and Fixes[/h1]
[list]
[*] [b]Build Import from ranalds.gift[/b] - Use \"/gwp_import [i]ranalds.gift-link[/i]\" to create missing items for the build and auto-equip them. Use \"CTRL+V\" to paste the ranalds.gift link into the ingame chat. This will not create duplicate items in your inventory.
[*] [b]Trait & Property Filters[/b] - No longer shows traits and properties that can't be crafted in official. Can be disabled in mod settings.
[*] [b]UI/UX Polish[/b] - Sorted dropdown lists, cleaned up overflowing text and fixed window position for other screen dimensions.
[/list]

[h1]Disclaimer[/h1]
Credits to the original authors for existing core functionalities, qol improvements and fixes.
[list]
[*] [url=https://steamcommunity.com/workshop/filedetails/?id=1425249043]Give Weapon[/url]
[*] [url=https://steamcommunity.com/sharedfiles/filedetails/?id=3370372364]GiveWeaponFix[/url]
[*] [url=https://steamcommunity.com/sharedfiles/filedetails/?id=2824452077]Give Weapon Supplement - Remove CW Traits[/url]
[*] [url=https://steamcommunity.com/sharedfiles/filedetails/?id=1687843693]Save Weapon[/url]
[/list]

[url=https://github.com/exquilibrium/vt2-stuff/blob/master/mods/]source code[/url]
";
