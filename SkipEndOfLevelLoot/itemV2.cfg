title = "SkipEndOfLevelLoot";
description = "Fixes server error when completing a game in modded realm.

[code]Backend rejected challenge response -1[/code]

Skips end of level loot screen.

[h1]Code[/h1]
[code]
local mod = get_mod(\"SkipEndOfLevelLoot\")

mod:hook(BackendInterfaceLootPlayfab, \"generate_end_of_level_loot\", function (func, self, ...)
	local id = self:_new_id()

	self._loot_requests[id] = {}

	return id
end)
[/code]";
